# 코드 스타일 설정 (2026-10-22)
#
# J Cheminform 의 재현성 점검표 7번이 "외부 린터를 통과하는가" 를 묻는다.
# 본문 코드는 black --line-length 100 으로 정렬했고, 그 뒤 pycodestyle
# 위반이 1,193건에서 116건으로 줄었다. 남은 것은 아래 세 종류이며
# 전부 **의도된 것**이라 무시 목록에 둔다.
#
#   E402  모듈 수준 import 가 맨 위에 있지 않다 (67건)
#         비트 단위 재현을 위해 numpy 를 들이기 **전에** OMP_NUM_THREADS
#         등 스레드 수를 고정해야 한다. 순서를 바꾸면 재현이 깨진다.
#         src/check_determinism.py 의 머리말에 이유가 적혀 있다.
#   E203  ':' 앞 공백 (18건)
#         black 의 슬라이스 정렬 방식과 pycodestyle 이 충돌하는 자리다.
#         black 공식 문서가 이 항목을 끄라고 안내한다.
#   E501  101자 줄 (13건)
#         한국어 주석은 글자 폭이 달라 100자에서 한두 자 넘는다.
#         실제 코드 줄이 아니라 설명문이다.
[pycodestyle]
max-line-length = 100
statistics = True
# 주의: pycodestyle 의 `ignore` 는 **기본 무시 목록을 덮어쓴다.**
# 앞 네 개만 적었더니 black 이 일부러 만드는 W503(이항 연산자 앞
# 줄바꿈)이 219건 새로 켜져 위반이 116 에서 242 로 늘었다
# (2026-10-22). 기본 목록을 같이 적어야 한다.
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E203,E402,E501

[flake8]
max-line-length = 100
extend-ignore = E203, E402, E501
exclude = .git,__pycache__,_backup,audit_pack
